<script>
/* ============================================================
   Longshore simulation: the cluster, its controllers, scheduler, crane, pods, traffic, bootstrap and snapshots.
   Shared by figure/longshore.html (the Colorfigures SVG engine) and figure/longshore3d.html (three.js).
   It needs these globals from the page: PALS, matOf, ease (shading palette helpers), ui (flash / animate /
   render) and reframe() (re-frame the view when the cluster changes size).
   ============================================================ */

/* ---------- units (x = depth, y = width, z = up) ---------- */
const PL = 24, PW = 10, PH = 10;                 // a pod: a 20-ft container lying along y
const SLD = 50, SLW = 66, SLH = 3;               // a node slab: 50 deep, 66 wide, 3 thick
const ROWS = 3, COLS = 2;                        // container slots per tier: 3 along x, 2 along y
const SX0 = 50, SY0 = 40, NGAP = 16, ROWGAP = 20;
const REG_Y0 = 176, REG_GAP = 26, REG_MAX = 4;   // image registry shelf: a stack per app
let W = 150, D = 284, HTOP = 70, XR0 = 44, XR1 = 106, HZT = 36, BZ = 58, LANE = 129;
const PAPER = '#f2efe7';
const CONC = { l:'#dedad0', m:'#c3bfb3', d:'#9d9889' };
const YARD = { l:'#e8e3d6', m:'#d2cbbb', d:'#aba394' };
const CRATE = { l:'#f1e6c8', m:'#d9ca9f', d:'#a8956a' };
const GLASS = '#1d2a26';
const LAMPC = { green:'#43c25c', amber:'#f2b230', red:'#e2483d', grey:'#9a948a' };
const APP_PALS = { web: PALS.cobalt, api: PALS.mint, db: PALS.tomato, cache: PALS.blush, train: matOf('#f08a2b'), spark: matOf('#9b7bd6') };
const GOLD = '#f2c230';
const EXTRA_PALS = ['#9b7bd6', '#4fb3b3', '#f08a2b', '#b9c45a', '#d98fd4', '#8aa0b8', '#c9a066', '#6fb86f'].map(matOf);
const palOf = app => { if (!APP_PALS[app]) APP_PALS[app] = EXTRA_PALS[Object.keys(APP_PALS).length % EXTRA_PALS.length]; return APP_PALS[app]; };

/* ---------- the demo cluster (the same shape tools/longshore.py writes; a raw kubectl List loads too) ---------- */
const DEMO = {
  context: 'demo',
  nodes: [ { name:'node-a' }, { name:'node-b' }, { name:'node-c', gpus:2 } ],
  deployments: [
    { name:'web', app:'web', replicas:3, version:'v1', containers:[{ name:'nginx', image:'nginx:1.27' }], configMap:'web-config', dependsOn:'api' },
    { name:'api', app:'api', replicas:2, version:'v1', containers:[{ name:'api', image:'yard/api:1.4' }, { name:'log-shipper', image:'fluent-bit:3' }], secret:'api-keys', dependsOn:'db' },
    { name:'db', app:'db', kind:'StatefulSet', replicas:1, version:'v1', containers:[{ name:'postgres', image:'postgres:16' }], pvc:'data-db-0' } ],
  services: [ { name:'web', selector:{ app:'web' }, ports:[80] }, { name:'api', selector:{ app:'api' }, ports:[8080] }, { name:'db', selector:{ app:'db' }, ports:[5432] } ],
  ingresses: [ { host:'shop.example.com', service:'web', port:80 } ] };

/* ---------- names ---------- */
const SUF = 'abcdefghijkmnpqrstuvwxyz0123456789';
let rseed = 7; const rnd = () => (rseed = (rseed * 48271) % 2147483647) / 2147483647;
const suffix = n => Array.from({ length:n }, () => SUF[Math.floor(rnd()*SUF.length)]).join('');
const rsHash = (app, ver) => { let h = 7; for (const ch of app + '/' + ver) h = (h*31 + ch.charCodeAt(0)) >>> 0; return (h.toString(36) + 'xxxxx').slice(0, 5); };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const lerp3 = (a, b, t) => [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, a[2] + (b[2]-a[2])*t];
const dist3 = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);

/* ---------- layout: where every node, rail and lane is ----------
   Two models share this file. The yard (the first draft): pods are containers in 3x2 slots stacked in tiers, and a crane
   carries each one from the registry. The shop (figure/shopfloor.html): pods are machines in a cell's bays, a flat grid of
   4 across and 3 deep that grows by rows, bound by a job card and pulled by the cell's own AGV. */
const isShop = () => st.model === 'shop';
const BAYX = 14, BAYY = 12, SHOP_COLS = 4, SHOP_ROWS = 3, SHOP_MAXROWS = 8;   // a cell's bays: BAYY apart across (y), BAYX apart deep (x)
const slotPos = (n, sl) => isShop() ? [n.x0 + 6 + sl.r*BAYX, n.y0 + 7 + sl.c*BAYY, 0] : [n.x0 + 6 + sl.r*(PW + 4), n.y0 + 6 + sl.c*(PL + 6), SLH + sl.t*PH];
const slotKey = sl => `${sl.c},${sl.r},${sl.t}`;
function freeSlot(n){
  if (isShop()){ for (let r = 0; r < SHOP_MAXROWS; r++) for (let c = 0; c < SHOP_COLS; c++){ const sl = { c, r, t:0 }; if (!n.used.has(slotKey(sl))) return sl; } return null; }
  for (let t = 0; t < 9; t++) for (let r = ROWS - 1; r >= 0; r--) for (let c = 0; c < COLS; c++){ const sl = { c, r, t }; if (!n.used.has(slotKey(sl))) return sl; } return null; }
const cellRows = n => { let r = SHOP_ROWS; for (const k of n.used) r = Math.max(r, +k.split(',')[1] + 1); return r; };
const cellDepth = n => isShop() ? 8 + cellRows(n)*BAYX : SLD;          // a cell grows deeper (along x) when it holds more than 12 machines
function layout(st){
  const ns = st.nodes, rows = Math.max(1, Math.ceil(ns.length / 3)), cols = Math.min(3, Math.max(1, ns.length));
  const depth = []; for (let r = 0; r < rows; r++) depth.push(Math.max(SLD, ...ns.slice(r*3, r*3 + 3).map(cellDepth)));
  let x = SX0; ns.forEach((n, i) => { const r = Math.floor(i/3); if (i % 3 === 0 && r > 0) x += depth[r - 1] + ROWGAP; n.x0 = x; n.y0 = SY0 + (i % 3)*(SLW + NGAP); n.row = r; n.depth = cellDepth(n); });
  const xEnd = x + depth[rows - 1];
  W = xEnd + 50; D = Math.max(284, SY0 + cols*(SLW + NGAP) - NGAP + 14);
  XR0 = SX0 - 6; XR1 = xEnd + 6; LANE = W - 21;
  let maxT = 2; for (const p of st.pods) if (p.slot) maxT = Math.max(maxT, p.slot.t);
  HZT = SLH + (maxT + 1)*PH + 3; BZ = HZT + 22; HTOP = isShop() ? 62 : BZ + 12;
  for (const p of st.pods) if (p.slot && p.node && st.crane.carry !== p && !NOPOS.has(p.phase)){ const n = ns.find(n => n.name === p.node); if (n) p.pos = slotPos(n, p.slot); }
}
const NOPOS = new Set(['scheduled', 'bound']);   // bound but not yet on the floor: the crane has it, or the job card is in the tube
const OFFICE = [20, 22, 26];                      // where the job cards leave the planning office: the counter on the mezzanine (shop)
// the words each figure's toasts use for the same Kubernetes fact
const VOC = () => isShop() ? {
  b0: 'kubeadm init: an empty floor and a dark office. Nothing can be scheduled until the control plane is up', b1: 'etcd is up: the ledger drawers light; the cluster has a memory',
  b2: 'kube-apiserver is serving on :6443: the counter opens and the tube pressurises; kubectl works from here on', b3: "kube-controller-manager and kube-scheduler are running: the dispatcher's desk opens and job cards can be issued",
  bj: n => `kubeadm join: ${n} powers on its controller cabinet (kubelet and container runtime)`, br: n => `${n} registered with the API server and is Ready: its cell is open for job cards`,
  bapp: 'kubectl apply -f app/: orders web x3, api x2 and db x1 posted on the board; their ReplicaSets raise the job cards', live: 'This is a real cluster and the floor only watches it' } : {
  b0: 'kubeadm init: an empty yard. Nothing can be scheduled until the control plane is up', b1: 'etcd is up: the cluster has a memory (every object will live in that cabinet)',
  b2: 'kube-apiserver is serving on :6443: kubectl works from here on', b3: 'kube-controller-manager and kube-scheduler are running: the crane powers up',
  bj: n => `kubeadm join: ${n} is bootstrapping its kubelet and container runtime`, br: n => `${n} registered with the API server and is Ready (kube-proxy and the CNI are on it)`,
  bapp: 'kubectl apply -f app/: Deployments web, api and db created; their ReplicaSets want 3, 2 and 1 Pods', live: 'This is a real cluster and the yard only watches it' };
const PULL = { cold: 1.4, warm: .25, start: .5 };  // an image the cell has never pulled, one from its rack, powering the machine up
const GRACE = 2, GRACE_MAX = 5;                    // terminationGracePeriodSeconds, scaled down: a machine drains (finishes the parts already sent to it, takes no new ones) before it powers down; past GRACE_MAX it is killed
const regIndex = (st, app) => { const i = st.regApps.indexOf(app); return i < 0 ? -1 : i; };
const regPos = (st, app) => { const i = Math.max(0, regIndex(st, app)); return [9, REG_Y0 + 4 + i*REG_GAP, 2 + 2*PH]; };
const nodeCenterY = n => n.y0 + SLW/2;

/* ---------- state ---------- */
let ui;
const st = { t:0, mode:'demo', model:'yard', nodes:[], pods:[], deploys:[], services:[], ingresses:[], regApps:[], seq:0,
  crane:{ x:75, y:130, z:36, carry:null, job:null, queue:[] }, caps:[], strobe:0, parcels:[], boom:0, boomT:0, rr:0, showSys:false,
  live:{ url:null, poll:0, timer:0, status:'' }, said:{}, pending503:0, cp:{ etcd:1, api:1, ctrl:1, hold:0 }, boot:null, reqs:{ sent:0, ok:0, err:0, reset:0 } };
// on the shop floor a machine that is powering down still counts for a moment, so its replacement card is raised after it stops
const podsOf = (app, alive = true) => st.pods.filter(p => p.app === app && (!alive || p.phase !== 'terminating' || (isShop() && p.phaseT < .6)));
const isReady = p => p.phase === 'running' && p.ready;
const lampOf = p => p.phase === 'terminating' ? LAMPC.grey : p.phase === 'done' ? '#5a82c6' : p.phase === 'crash' ? (p.phaseT < 1 ? LAMPC.red : LAMPC.amber) : isReady(p) ? LAMPC.green : LAMPC.amber;
const imageOf = p => (p.containers[0] || {}).image || p.app;
const depOf = app => st.deploys.find(d => d.app === app);
function say(key, text, ms = 2300){ if (!ui) return; const now = performance.now(); if (st.said[key] && now - st.said[key] < 2600) return; st.said[key] = now; ui.flash(text, ms); }

function makePod(dep, ver){
  ver = ver || dep.version;
  return { id: ++st.seq, name: `${dep.name}-${rsHash(dep.app, ver)}-${suffix(5)}`, ns: dep.ns || 'default', app: dep.app, ver, band: false,
    node: null, slot: null, phase: 'pending', phaseT: 0, ready: false, restarts: 0, alpha: 1, fire: 0, pos: null,
    containers: dep.containers || [{ name: dep.app, image: dep.app }], pvc: dep.pvc, configMap: dep.configMap, secret: dep.secret, sys: false, born: st.t,
    gpu: dep.gpu || 0, gang: dep.gang ? dep.app : null, job: dep.kind === 'Job', waitingOn: null, drop: null };
}
function placePod(p, n, sl){ p.node = n.name; p.slot = sl; n.used.add(slotKey(sl)); p.pos = slotPos(n, sl); }
function removePod(p){ const n = st.nodes.find(n => n.name === p.node); if (n && p.slot) n.used.delete(slotKey(p.slot)); if (st.crane.carry === p) st.crane.carry = null;
  st.crane.queue = st.crane.queue.filter(j => j.pod !== p); st.caps = st.caps.filter(c => c.pod !== p); st.pods = st.pods.filter(q => q !== p); }
// the newest version of an app (when there is more than one) wears the pale band
function markBands(){ for (const app of new Set(st.pods.map(p => p.app))){ const vs = [...new Set(podsOf(app, false).map(p => p.ver))];
  if (vs.length < 2){ for (const p of podsOf(app, false)) p.band = false; continue; } vs.sort(); const top = vs[vs.length - 1]; for (const p of podsOf(app, false)) p.band = p.ver === top; } }
function refreshRegistry(){ const count = {}; for (const p of st.pods) count[p.app] = (count[p.app] || 0) + 1; for (const d of st.deploys) count[d.app] = count[d.app] || 0;
  const apps = Object.keys(count).sort((a, b) => count[b] - count[a] || a.localeCompare(b)); const keep = st.regApps.filter(a => apps.includes(a));
  for (const a of apps) if (!keep.includes(a) && keep.length < REG_MAX) keep.push(a); st.regApps = keep; }

/* ---------- controllers (demo mode): Deployments and ReplicaSets want N pods of the current version ---------- */
function reconcile(){
  for (const p of st.pods) if (!depOf(p.app) && p.phase !== 'terminating' && st.mode === 'demo') terminate(p);
  for (const dep of st.deploys){
    if (dep.kind === 'Job'){ if (!dep.spawned){ dep.spawned = true; for (let i = 0; i < dep.replicas; i++) st.pods.push(makePod(dep));
        say('job-' + dep.app, dep.gang ? `Volcano PodGroup ${dep.app} (minMember ${dep.minMember || dep.replicas}): ${dep.replicas} Pods Pending until all fit at once` : `Job ${dep.app}: ${dep.replicas} Pods Pending`); } continue; }
    const live = podsOf(dep.app), newer = live.filter(p => p.ver === dep.version), older = live.filter(p => p.ver !== dep.version);
    const readyN = live.filter(isReady).length;
    if (!older.length){
      while (podsOf(dep.app).length < dep.replicas){ st.pods.push(makePod(dep)); say('rs-' + dep.app, `ReplicaSet ${dep.name}-${rsHash(dep.app, dep.version)} wants ${dep.replicas}: a new Pod is Pending`); }
      const extra = live.length - dep.replicas;
      if (extra > 0) live.slice().sort((a, b) => b.born - a.born).slice(0, extra).forEach(p => terminate(p));
    } else {
      // rolling update, maxSurge 1 / maxUnavailable 0: one new pod up, then one old pod down once it is Ready
      if (live.length < dep.replicas + 1 && newer.length < dep.replicas){ st.pods.push(makePod(dep)); say('roll-' + dep.app, `Rollout: new ReplicaSet ${dep.name}-${rsHash(dep.app, dep.version)} surges one ${dep.version} Pod`); }
      if (readyN > dep.replicas && older.length){ terminate(older.sort((a, b) => a.born - b.born)[0]); say('rolldown-' + dep.app, `A ${dep.version} Pod is Ready, so one old Pod is scaled down`); }
    }
  }
  markBands(); refreshRegistry();
}
function terminate(p){ if (p.phase === 'terminating') return; if (p.phase === 'crash') p.down = true; p.phase = 'terminating'; p.phaseT = 0; p.ready = false; p.drop = null; p.alpha = 1; }
// draining: Terminating but still within its grace period, finishing the parts already inside it (a Service never sends it new ones)
const draining = p => p.phase === 'terminating' && !p.down && (p.phaseT < GRACE || p.phaseT < GRACE_MAX && st.parcels.some(pc => pc.pod === p && pc.dir === 1));
// gone for an in-flight request: removed, crashed, or past its grace period and powered down
const poweredDown = p => !st.pods.includes(p) || p.phase === 'crash' || (p.phase === 'terminating' && !draining(p));
// a pod's readiness probe needs the thing it talks to: api needs a Ready db, web needs a Ready api
const depHealthy = app => { const d = depOf(app); return !d || !d.dependsOn || podsOf(d.dependsOn).some(isReady); };
function checkDependencies(){
  for (const p of st.pods) if (p.phase === 'running' && p.ready && !depHealthy(p.app)){ const d = depOf(p.app);
    p.phase = 'unready'; p.phaseT = 0; p.ready = false; p.waitingOn = d.dependsOn; say('dep-' + p.app, `${p.app} readiness probes failing: Service ${d.dependsOn} has no Ready endpoints (${p.app} stays up but gets no traffic)`); }
}
const gpuUsed = n => st.pods.filter(p => p.node === n.name && p.phase !== 'terminating').reduce((a, p) => a + (p.gpu || 0), 0);
const gpuFree = n => (n.gpus || 0) - gpuUsed(n);
const slotsFree = n => (isShop() ? SHOP_COLS*SHOP_MAXROWS : ROWS*COLS*9) - n.used.size;
const cellCap = () => isShop() ? SHOP_COLS*SHOP_ROWS : ROWS*COLS*3;
/* scheduler: every Pending pod gets a node with a free slot (fewest pods first), then the crane delivers it */
function schedule(){
  scheduleGangs();
  for (const p of st.pods){ if (p.phase !== 'pending' || p.sys && !st.showSys || p.gang) continue;
    let cands = st.nodes.filter(n => n.ready && !n.cordoned && freeSlot(n) && (st.mode === 'live' || gpuFree(n) >= (p.gpu || 0)));
    if (st.mode === 'live') cands = cands.filter(n => n.name === p.wantNode);
    if (!cands.length){ if (st.mode === 'demo') say(p.gpu ? 'nogpu' : 'nosched', p.gpu ? `Pending: ${p.name} requests nvidia.com/gpu: ${p.gpu} and no node has a free GPU` : 'Pending: no schedulable node has room (uncordon one)'); continue; }
    cands.sort((a, b) => countOn(a) - countOn(b) || a.name.localeCompare(b.name));
    const n = cands[0], sl = freeSlot(n); placePod(p, n, sl); p.pos = null;
    if (isShop()){ p.phase = 'bound'; p.phaseT = 0; st.caps.push(mkCap(p, n)); say('bind', `Scheduler bound ${p.name} to ${n.name}: spec.nodeName written, the job card is on its way to the cell`); continue; }
    p.phase = 'scheduled';
    st.crane.queue.push({ pod: p, from: regPos(st, p.app), to: slotPos(n, sl) });
    say('bind', `Scheduler bound ${p.name} to ${n.name}`);
  }
}
const countOn = n => st.pods.filter(p => p.node === n.name && p.phase !== 'terminating').length;
/* gang scheduling (Volcano PodGroup): a group is admitted only when every member fits at once; then the whole
   group lands together, by parachute, without the crane */
function scheduleGangs(){
  const groups = {}; for (const p of st.pods) if (p.phase === 'pending' && p.gang) (groups[p.gang] = groups[p.gang] || []).push(p);
  for (const [app, members] of Object.entries(groups)){ const dep = depOf(app), need = dep ? (dep.minMember || dep.replicas) : members.length;
    if (members.length < need) continue;
    const room = st.nodes.filter(n => n.ready && !n.cordoned).map(n => ({ n, slots: slotsFree(n), gpus: gpuFree(n), count: countOn(n) }));
    const plan = [];

      if (!p){ p = makePod(dep, d.version || 'v1'); p.name = d.name; p.ns = d.namespace || 'default'; p.containers = d.containers && d.containers.length ? d.containers : p.containers; p.pvc = d.pvc; p.configMap = d.configMap; p.secret = d.secret; p.sys = !!d.system; p.gpu = d.gpu || 0; st.pods.push(p); }
      p.wantNode = d.node; p.restarts = d.restarts || 0;
      const want = d.phase === 'Running' ? (d.ready ? 'running' : 'unready') : d.phase === 'Pending' ? 'pending' : d.phase === 'Failed' || d.phase === 'CrashLoopBackOff' ? 'crash' : d.phase === 'Succeeded' ? 'terminating' : 'running';

        else if (n && sl){ p.phase = 'pending'; }
        else { p.phase = 'pending'; } }

        else if (want === 'running' && p.phase !== 'running'){ p.phase = 'running'; p.ready = true; p.phaseT = 0; }
        else if (want === 'crash' && p.phase !== 'crash'){ p.phase = 'crash'; p.phaseT = -1e9; p.fire = 1; p.ready = false; }

function removeFromNode(p){ const n = st.nodes.find(n => n.name === p.node); if (n && p.slot) n.used.delete(slotKey(p.slot)); p.node = null; p.slot = null; p.pos = null; }
function startDemo(){
  st.mode = 'demo'; stopLive(); st.pods = []; st.crane.queue = []; st.crane.job = null; st.crane.carry = null; st.caps = []; st.parcels = []; st.nodes = [];
  applySnapshot(JSON.parse(JSON.stringify(DEMO)), true);
  for (const n of st.nodes){ n.used = new Set(); n.tape = 0; n.cordoned = false; n.cache = new Set(); n.pull = null; }
  // the demo starts deployed: pods spread over the nodes, all Running (so every node has those images cached)
  const order = ['web', 'api', 'db']; let i = 0;
  for (const app of order){ const dep = depOf(app); if (!dep) continue; for (let r = 0; r < dep.replicas; r++){ const p = makePod(dep); const n = st.nodes[i++ % st.nodes.length]; placePod(p, n, freeSlot(n)); p.phase = 'running'; p.ready = true; n.cache.add(p.app + ':' + p.ver); st.pods.push(p); } }
  markBands(); refreshRegistry(); layout(st); st.crane.x = (XR0 + XR1)/2; st.crane.y = D/2; st.crane.z = HZT; if (ui) reframe();
}
function stopLive(){ if (st.live.timer) clearInterval(st.live.timer); st.live.timer = 0; st.live.url = null; st.live.status = ''; }

  try { const r = await fetch(st.live.url, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); const data = await r.json();

}

}
function loadFile(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const fl = inp.files[0]; if (!fl) return; fl.text().then(txt => { let data; try { data = JSON.parse(txt); } catch (e){ return say('badjson', 'That file is not JSON', 2600); }

    applySnapshot(data, true); st.live.status = 'file'; say('file', `Loaded ${fl.name}: ${st.pods.length} pods on ${st.nodes.length} nodes`); ui.render(); }); };

const liveNote = cmd => say('ro-' + cmd, `${VOC().live}. Run: ${cmd}`, 3400);

/* ---------- buttons ---------- */

<script>
/* ============================================================

   as the yard. It watches the state for changes (a Deployment applied, a Pod bound, a probe passing) and plays the
   true sequence for each as messages between the boxes:
     kubectl -> kube-apiserver pipeline (authentication, authorization, mutating admission, validating admission,
     schema validation, write) -> etcd (Raft: the leader proposes and appends the entry, replicates it to the
     followers, a quorum acknowledges, it is committed and applied) -> the watch cache fans the event out to every
     watcher -> controllers (informer cache -> work queue -> reconcile -> a write back to the API server), the
     scheduler (filter -> score -> bind), the kubelet on the bound node (watch -> CRI pull and start -> probes ->
     status) and kube-proxy (EndpointSlices -> rules).
   Two extra Break choices stop an etcd follower (nothing changes: the leader still has a quorum) or the leader

   ============================================================ */
(() => {

/* ---------- geometry ---------- */
const STAGES = ['AuthN', 'AuthZ (RBAC)', 'Mutating\nadmission', 'Validating\nadmission', 'Schema\nvalidation', 'Write\n(storage)'];
const sx = i => 162 + i*76 + 35, SY = 81;                       // API pipeline stage centres

  s += `<g id="s-score">` + box(662, 312, 306, 28, { r: 4 }) + text('SCORE', 672, 326, { size: 10, anchor: 'start' }) + text('spread: fewest pods first', 728, 326, { size: 9.5, weight: 600, col: MUTED, anchor: 'start' }) + `<g id="s-scorenote"></g></g>`;
  s += `<g id="s-bind">` + box(662, 348, 306, 24, { r: 4 }) + text('BIND', 672, 360, { size: 10, anchor: 'start' }) + text('write pod.spec.nodeName', 728, 360, { size: 9.5, weight: 600, col: MUTED, anchor: 'start' }) + '</g>';
  s += arrow([[815, 264], [815, 271]], { w: 1 }) + arrow([[815, 304], [815, 311]], { w: 1 }) + arrow([[815, 340], [815, 347]], { w: 1 });
  s += `<path d="M968 360L978 360L978 ${BUS + 8}" fill="none" stroke="${INKC}" stroke-width="1" opacity=".55"/>` + text('write', 976, BUS + 20, { size: 8.5, weight: 600, col: MUTED, anchor: 'end' });
  // kubelet

/* ---------- the moving parts ---------- */
const sleep = ms => new Promise(r => R.timers.push({ at: R.now + ms, r }));
const plen = pts => pts.reduce((a, p, i) => i ? a + Math.hypot(p[0] - pts[i-1][0], p[1] - pts[i-1][1]) : 0, 0);
function bead(pts, o = {}){ const L = plen(pts); return new Promise(r => { R.flows.push({ pts, L, col: o.col || BLUEC, label: o.label || '', t: 0, dur: o.dur || Math.max(220, L*2.2), small: !!o.small, r }); drive(); }); }
const at = (f, u) => { let d = u*f.L; for (let i = 1; i < f.pts.length; i++){ const a = f.pts[i-1], b = f.pts[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]); if (d <= l || i === f.pts.length - 1){ const k = l ? Math.min(1, d/l) : 0; return [a[0] + (b[0] - a[0])*k, a[1] + (b[1] - a[1])*k]; } d -= l; } return f.pts[f.pts.length - 1]; };
function lit(id, ms = 700){ R.lit.set(id, R.now + ms); drive(); }
function logLine(s){ R.log = s; if (logEl) logEl.textContent = s; }
function tick(dt){
  R.now += dt*1000*cfg.speed();
  for (const t of R.timers.slice()) if (R.now >= t.at){ R.timers.splice(R.timers.indexOf(t), 1); t.r(); }
  for (const f of R.flows.slice()){ f.t += dt*1000*cfg.speed(); if (f.t >= f.dur){ R.flows.splice(R.flows.indexOf(f), 1); f.r(); } }
  for (const [k, until] of R.lit) if (R.now >= until) R.lit.delete(k);

async function election(from){

  const cand = live[0]; R.members[cand].role = 'candidate'; render(); logLine(`etcd-${cand + 1}: election timeout, RequestVote for term ${R.term}`);
  const others = live.filter(i => i !== cand);
  await Promise.all(others.map(i => bead([[mx(cand), MY], [mx(i), MY]], { label: `RequestVote t${R.term}`, col: AMBER, dur: 300, small: true })));
  await Promise.all(others.map(i => bead([[mx(i), MY], [mx(cand), MY]], { label: 'vote', col: GREEN, dur: 300, small: true })));
  R.leader = cand; R.members.forEach((m, i) => { m.role = i === cand ? 'leader' : 'follower'; if (m.up) m.term = R.term; }); R.noLeader = false; render();
  logLine(`etcd-${cand + 1} is the leader for term ${R.term}: writes go through again`);
}
async function stopFollower(){ if (R.down != null) return cfg.say('etcd-down', 'One etcd member is already stopped: with 3 members only one can be lost and keep a quorum');
  const i = R.members.findIndex((m, j) => j !== R.leader && m.up); R.down = i; R.members[i].up = false; render();
  cfg.say('etcd-f', `etcd-${i + 1} (a follower) stopped: the leader still has a quorum of 2 of 3, so every write goes on as before`, 3400); logLine(`etcd-${i + 1} stopped; quorum 2 of 3 holds`);
  chain('etcd:follower', async () => { await sleep(7000); const m = R.members[i]; m.up = true; m.term = R.term; const L = R.members[R.leader]; const missed = L.log.length - m.log.length; m.log = L.log.map(e => ({ ...e })); m.commit = L.commit; R.down = null; render();
    cfg.say('etcd-fb', `etcd-${i + 1} is back: the leader replays the ${missed} entr${missed === 1 ? 'y' : 'ies'} it missed and it catches up`, 3000); logLine(`etcd-${i + 1} rejoined and caught up (${missed} entries replayed)`); });
}
async function stopLeader(){ if (R.down != null) return cfg.say('etcd-down', 'One etcd member is already stopped: with 3 members only one can be lost and keep a quorum');
  const i = R.leader; R.down = i; R.members[i].up = false; R.members[i].role = 'stopped'; R.noLeader = true; cfg.st.cp.hold = 1; render();
  cfg.say('etcd-l', `etcd-${i + 1} (the leader) stopped: no leader, so the API server cannot commit any write until an election finishes (reads still serve)`, 3600); logLine(`etcd-${i + 1} (leader) stopped: writes wait`);
  chain('etcd:leader', async () => { await sleep(1500); await election(i); cfg.st.cp.hold = 0; cfg.say('etcd-le', `Term ${R.term}: etcd-${R.leader + 1} elected leader; the queued writes go through and the controllers resume`, 3200); cfg.run();
    await sleep(6000); const m = R.members[i]; m.up = true; m.role = 'follower'; m.term = R.term; const L = R.members[R.leader]; m.log = L.log.map(e => ({ ...e })); m.commit = L.commit; R.down = null; render();
    cfg.say('etcd-lb', `etcd-${i + 1} is back as a follower in term ${R.term} and catches up on the log`, 3000); logLine(`etcd-${i + 1} rejoined as a follower (term ${R.term})`); });
}

/* ---------- mount ---------- */
function mount(host, c){ cfg = c; el = host;
  el.innerHTML = `<div class="cap"><b>CONTROL ROOM</b><span>what the control plane does for every operation ${st.model === 'shop' ? 'on the floor' : 'in the yard'}</span></div><div class="scroll"><svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace"></svg></div><div class="log"></div>`;
  svg = el.querySelector('svg'); svg.innerHTML = staticSvg(); dyn = svg.querySelector('#dyn'); logEl = el.querySelector('.log');
  R.lastT = performance.now(); render(); logLine(`Idle. Press a ${st.model === 'shop' ? 'floor' : 'yard'} button and watch the messages.`);
}
window.ControlRoom = { mount, observe: () => { if (cfg) observe(); }, shown: v => { shown = v; if (v && svg) render(); }, stopFollower, stopLeader, R,
  step: dt => { if (!cfg) return; const s = cfg.speed; cfg.speed = () => 1; tick(dt); cfg.speed = s; render(); } };
})();

</script>
<script>

    el.innerHTML = `<span class="long">${b.label}</span><span class="short">${b.short || b.label}</span>${b.choices ? '<span class="car">▾</span>' : ''}`; wrap.appendChild(el); btns.appendChild(wrap);

      for (const c of b.choices()){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label; if (c.current) ch.setAttribute('aria-pressed', 'true');

// the chapter's prose comes out of the guide itself, so there is one text to keep right

const CHAPTER = {
  boot: { follow: 1 }, apply: { follow: 1 }, scale: { follow: 1 }, rollout: { follow: 1 }, heal: { follow: 1 }, probes: { follow: 1 }, gang: { follow: 1 }, traffic: { follow: 1 },

function applyChapter(id, camParams){ const c = CHAPTER[id]; if (!c) return;

/* ---------- the card: what was tapped, with the actions that make sense there ---------- */
const card = $('#card'); let cardAct = null, cardHtml = '';
card.querySelector('.x').onclick = hideCard;
function hideCard(){ card.classList.remove('open'); cardAct = null; html.style.setProperty('--cardh', '0px'); yard && yard.select(null); }
function open(a){ cardAct = a; cardHtml = ''; renderCard(); card.classList.add('open'); yard.select(a);
  html.style.setProperty('--cardh', isYard() ? (card.offsetHeight + 8) + 'px' : '0px');   // the toast sits above the card in full screen

const LAMP = c => `<span class="lamp" style="background:${c}"></span>`;

  : { node: 'Node', tower: 'Harbour tower', kiosk: 'Kiosk', gate: 'the gate', registry: 'Registry shelf', crane: 'Gantry crane', board: 'Deployments board', runs: 'kubelet, container runtime, kube-proxy', pullNote: 'The kubelet pulls from here before a container can start.', kick: 'In the yard', inflight: 'requests in the yard now', boot: 'empty the yard and bring it up in order' };

  : p.phase === 'creating' ? (SHOP() ? 'ContainerCreating: the machine is powering up' : 'ContainerCreating (pulling the image)') : p.phase === 'dropping' ? (SHOP() ? 'Bound as a gang, job cards in the tube' : 'Bound as a gang, landing')

const EXPLAIN = {

  'CAPACITY': 'How much of the node\'s room is allocated. The scheduler only binds a pod where its requests fit.',
  'POD': 'The unit Kubernetes schedules: one or more containers placed and moved as one thing.',
  'READY LAMP': 'Green: the readiness probe passes and the pod is a Service endpoint. Amber: not yet or not now. Red: crashed.',

  'DATA PORT': 'The pod\'s one IP and port space, patched to the cell\'s kube-proxy switch.',

  'SWITCH': 'kube-proxy: the cell\'s network switch, patched so a Service address reaches a Ready machine.',

  'JOB BOARD': 'Where the cell\'s bound job cards arrive from the tube: the kubelet\'s watch on Pods with its nodeName.',
  'TUBE': 'The watch stream made physical: every write the API server commits is blown to every cell that watches for it.',
  'LEDGER': 'etcd: the cabinet of record in the office, three drawers for the three Raft members.',

  'ORDER BOARD': 'The controllers: the orders on the wall (web x3 rev1) that the floor is kept matching to.',
  'CRIB': 'The image registry: the caged store the cells fetch crates (images) from.',
  'PRESS': 'A GPU: an extended resource only this cell advertises. A job that needs one is all-or-nothing per press.',
  'ANDON': 'Green: Ready and a Service endpoint. Amber: starting or not ready. Red: crashed. Blue: completed. Off: terminating.',
  'STATION': 'A Service: the sorting station that routes each incoming part to any green-andon machine of that job, round robin.',
  'DOCK': 'An Ingress: the receiving dock where parts for a hostname come in and are sent to a Service.' };
function cardFor(a){
  if (a.type === 'pod'){ const p = st.pods.find(p => p.id === a.id); if (!p) return null; const d = depOf(p.app), live = st.mode === 'live';
    return { kick: `${d ? d.kind : 'Pod'} · ${esc(p.app)}`, title: `<span class="sw" style="background:${palOf(p.app).l}"></span>${esc(p.name)}`,
      body: `<table>${row('Status', LAMP(lampOf(p)) + esc(phaseText(p)))}${row('Node', esc(p.node || '—'))}${row('Version', esc(p.ver) + (p.gpu ? ` · GPU x${p.gpu}` : ''))}` +
        row('Containers', p.containers.map(c => `${esc(c.name)} <span style="color:var(--muted)">${esc(c.image || '')}</span>`).join('<br>')) + row('Restarts', p.restarts) +
        (p.pvc ? row('Volume', esc(p.pvc)) : '') + (p.configMap ? row('ConfigMap', esc(p.configMap)) : '') + (p.secret ? row('Secret', esc(p.secret)) : '') + '</table>',
      acts: [ { label:'delete', title: live ? 'shows the kubectl command' : 'the ReplicaSet replaces it', onClick: () => { deletePod(p.app, p); run(); } },
        { label:'crash', onClick: () => { crashPod(p); run(); } }, { label:'fail probe', onClick: () => { unreadyPod(p); run(); } },

  if (a.type === 'node'){ const n = st.nodes.find(n => n.name === a.node); if (!n) return null; const mine = st.pods.filter(p => p.node === n.name && p.phase !== 'terminating' && !(p.sys && !st.showSys)), cap = cellCap();

      row('Pods', `${mine.length} on this node`) + row('Capacity', `${n.used.size}/${cap} ${SHOP() ? 'bays' : 'slots'} allocated`) + (n.gpus ? row('GPUs', `${gpuUsed(n)}/${n.gpus} in use`) : '') +
      (SHOP() ? row('Image cache', n.cache && n.cache.size ? [...n.cache].map(esc).join(', ') : 'empty') + row('Pulling', n.pull ? esc(imageOf(n.pull.pod)) + (n.pull.warm ? ' (from the cache)' : ' (from the registry)') : 'nothing; ' + st.pods.filter(p => p.node === n.name && p.phase === 'queued').length + ' queued') : '') +

    return { kick: 'Control plane', title: T().tower, body: `<table>${row('etcd', LAMP(cp.etcd && !cp.hold ? LAMPC.green : cp.etcd ? LAMPC.amber : LAMPC.red) + (!cp.etcd ? 'down' : cp.hold ? 'no leader, election running' : R ? `leader ${esc(R.members[R.leader].name)}, term ${R.term}, ${R.members.filter(m => m.up).length}/3 up` : 'up'))}` +

  if (a.type === 'kiosk'){ const svc = svcMain(); if (!svc) return { kick:'Service', title: T().kiosk, body:'<p>No Service in this cluster.</p>', acts: [] }; const eps = endpointsOf(svc), all = st.pods.filter(p => p.app === (svc.selector || {}).app && p.pos && p.phase !== 'terminating');
    return { kick: 'Service · ClusterIP', title: `${esc(svc.name)}:${(svc.ports || [])[0] || 80}`, body: `<table>${row('Selector', esc(Object.entries(svc.selector || {}).map(([k, v]) => k + '=' + v).join(', ') || '—'))}` +
      row('Endpoints', eps.length ? eps.map(p => LAMP(LAMPC.green) + esc(p.name)).join('<br>') : '<span style="color:#b3261e">none Ready (503)</span>') +
      (all.length > eps.length ? row('Not Ready', all.filter(p => !eps.includes(p)).map(p => LAMP(lampOf(p)) + esc(p.name)).join('<br>')) : '') + row('Round robin', `next: ${eps.length ? esc(eps[st.rr % eps.length].name) : '—'}`) + '</table>',
      acts: [ { label:'send a request', go: true, onClick: () => { request(); run(); } } ] }; }
  if (a.type === 'gate'){ const ing = st.ingresses[0], svc = svcMain();
    return { kick: 'Ingress', title: esc(ing ? ing.host : T().gate), body: `<table>${row('Routes to', svc ? `Service ${esc(svc.name)}:${ing && ing.port || (svc.ports || [])[0] || 80}` : '—')}${row('Then', 'kube-proxy sends it to one Ready endpoint')}${row('Requests', `${st.parcels.length} ${T().inflight}`)}${row('Answered', `${st.reqs.ok} of ${st.reqs.sent}`)}${row('Errors', st.reqs.err ? `${st.reqs.err}: ${st.reqs.reset} connection reset, ${st.reqs.err - st.reqs.reset} with no endpoint (503)` : 'none')}</table>`,
      acts: [ { label:'send a request', go: true, onClick: () => { request(); run(); } } ] }; }
  if (a.type === 'registry'){ return { kick: 'Image registry', title: T().registry, body: `<table>${st.regApps.map(app => { const d = depOf(app); return row(esc(app), esc(d && d.containers && d.containers[0] ? d.containers[0].image : app) + (d ? ` · ${esc(d.version)}` : '')); }).join('') || row('Images', 'none')}</table><p style="color:var(--muted);margin-top:6px">${T().pullNote}</p>`,

    return { kick: 'Deployments', title: T().board, body: `<div class="rows">${deps.map(d => { const live = podsOf(d.app), rd = d.kind === 'Job' ? live.filter(p => p.phase === 'done').length : live.filter(isReady).length;
      return `<button data-app="${esc(d.app)}"><i style="background:${palOf(d.app).l}"></i><span class="nm">${esc(d.name)}</span><span class="${rd < d.replicas ? 'bad' : ''}">${rd}/${d.replicas}</span><span class="ver">${esc(d.version)}</span></button>`; }).join('') || '<p>nothing applied</p>'}</div>`,
      acts: [], onBody: b => b.querySelectorAll('button[data-app]').forEach(x => x.onclick = () => open({ type:'app', app: x.dataset.app })) }; }
  if (a.type === 'app'){ const d = depOf(a.app); if (!d) return null; const live = podsOf(d.app);
    return { kick: `${esc(d.kind)} · ${esc(d.ns || 'default')}`, title: `<span class="sw" style="background:${palOf(d.app).l}"></span>${esc(d.name)}`,
      body: `<table>${row('Replicas', `${live.filter(isReady).length} ready of ${d.replicas} wanted`)}${row('Version', esc(d.version))}${row('Pods', live.map(p => LAMP(lampOf(p)) + esc(p.name)).join('<br>') || '—')}</table>`,
      acts: d.kind === 'Job' ? [] : [ { label:'scale…', onClick: () => openSheet(`Scale ${d.name}`, scaleChoices(d.app)) },
        { label:'roll out…', onClick: () => openSheet(`Roll out ${d.name}`, ['v1', 'v2', 'v3'].map(v => ({ label: `${d.name} ${v}`, current: d.version === v, onClick: () => rollout(d.app, v) }))) },
        { label:'delete', onClick: () => { deleteDep(d.app); hideCard(); } } ] }; }
  if (a.type === 'crane'){ const c = st.crane; return { kick: 'Scheduler', title: T().crane, body: SHOP() ? `<p>${st.caps.length ? `${st.caps.length} job card${st.caps.length === 1 ? '' : 's'} in the tube` : 'No job cards in flight'}; ${st.pods.filter(p => p.phase === 'pending').length} Pending.</p><p style="color:var(--muted)">${EXPLAIN.SCHEDULER}</p>` : `<p>${c.carry ? `Carrying ${esc(c.carry.name)} to ${esc(c.carry.node)}` : c.job && c.job.pod ? `Fetching ${esc(c.job.pod.name)} from the registry` : 'Idle'}${c.queue.length ? `; ${c.queue.length} more bound and waiting` : ''}.</p><p style="color:var(--muted)">${EXPLAIN.SCHEDULER}</p>`,
      acts: [ { label: yard.following() ? 'stop following' : 'follow', onClick: () => yard.follow(!yard.following()) } ] }; }
  if (a.type === 'explain') return { kick: T().kick, title: esc(a.text), body: `<p>${esc(EXPLAIN[a.text] || '')}</p>`, acts: [] };
  return null;
}
function renderCard(){ if (!cardAct) return; const c = cardFor(cardAct); if (!c){ hideCard(); return; }
  const h = c.kick + '|' + c.title + '|' + c.body + '|' + c.acts.map(x => x.label).join(','); if (h === cardHtml) return; cardHtml = h;
  card.querySelector('.kick').innerHTML = c.kick; card.querySelector('h3').innerHTML = c.title; const body = card.querySelector('.body'); body.innerHTML = c.body; if (c.onBody) c.onBody(body);

/* ---------- the clock: a dial for simulated time, in the strip on a page and as a sheet in full screen ---------- */
const CLK = { stops: [.1, .25, .5, 1, 2, 4], speed: 1, paused: false };
const fmt = v => (v >= 1 ? v : +v.toFixed(2)) + '×';
function setClock(speed, paused, quiet){ CLK.speed = Math.max(.05, Math.min(8, speed)); CLK.paused = !!paused; const was = SPEED; SPEED = CLK.paused ? 0 : CLK.speed;
  try { sessionStorage.setItem('kubeshop.clock', String(CLK.speed)); } catch {}
  drawClock(); if (was === 0 && SPEED > 0 && yard.resume) yard.resume(); if (!quiet && yard) yard.invalidate(); }
function stepClock(){ if (!CLK.paused) setClock(CLK.speed, true); if (yard.step) yard.step(.1); }
function nudgeClock(d){ const i = CLK.stops.findIndex(s => Math.abs(s - CLK.speed) < 1e-6), j = i < 0 ? (d > 0 ? CLK.stops.findIndex(s => s > CLK.speed) : CLK.stops.length - 1 - [...CLK.stops].reverse().findIndex(s => s < CLK.speed)) : i + d;
  if (j >= 0 && j < CLK.stops.length) setClock(CLK.stops[j], CLK.paused); }
const clockItems = () => [ { label: CLK.paused ? 'Resume' : 'Pause', sub: CLK.paused ? 'the floor and the room are held' : 'hold the floor and the room; the camera still moves', onClick: () => setClock(CLK.speed, !CLK.paused) },
  { label: 'Step 0.1 s', sub: 'one simulated slice, pausing first', onClick: stepClock },
  ...CLK.stops.map(s => ({ label: fmt(s), current: !CLK.paused && Math.abs(s - CLK.speed) < 1e-6, sub: s < 1 ? 'slower: follow each event' : s > 1 ? 'faster' : 'real time', onClick: () => setClock(s, false) })) ];
function drawClock(){ const row = $('#clock'), pill = $('#clockb'); if (pill) pill.textContent = 'Clock ' + (CLK.paused ? '⏸ ' + fmt(CLK.speed) : fmt(CLK.speed));
  if (!row) return; if (!row.childElementCount){ row.innerHTML = '<span class="k">Clock</span>' + CLK.stops.map(s => `<button data-s="${s}">${fmt(s)}</button>`).join('') + '<button data-p>Pause</button><button data-step title="advance one simulated 0.1 s">Step</button>';
    row.querySelectorAll('button[data-s]').forEach(b => b.onclick = () => setClock(+b.dataset.s, false)); row.querySelector('button[data-p]').onclick = () => setClock(CLK.speed, !CLK.paused); row.querySelector('button[data-step]').onclick = stepClock; }
  row.querySelectorAll('button[data-s]').forEach(b => b.setAttribute('aria-pressed', !CLK.paused && Math.abs(+b.dataset.s - CLK.speed) < 1e-6)); const p = row.querySelector('button[data-p]'); p.textContent = CLK.paused ? 'Resume' : 'Pause'; p.setAttribute('aria-pressed', CLK.paused); }
function wireClock(){ let s0 = 1; try { s0 = +sessionStorage.getItem('kubeshop.clock') || 1; } catch {} if (Q.has('speed')) s0 = Math.max(.1, +Q.get('speed') || 1);
  setClock(s0, false, true); const pill = $('#clockb'); if (pill) pill.onclick = () => openSheet('Clock', clockItems());
  addEventListener('keydown', e => { if (/input|textarea|select/i.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '[') nudgeClock(-1); else if (e.key === ']') nudgeClock(1); else if (e.key === ' ' && !document.querySelector('.sheet.open')){ e.preventDefault(); setClock(CLK.speed, !CLK.paused); } }); }

/* ---------- stats, switches, swatches, view ---------- */
const statsEl = document.getElementById('stats'), prevStats = {};
function drawStats(){ const shown = st.pods.filter(p => !(p.sys && !st.showSys) && p.phase !== 'terminating');
  const list = [ { label:'Pods ready', value:`${shown.filter(isReady).length}/${shown.length}` },
    { label:'Nodes', value: st.nodes.every(n => n.ready) ? String(st.nodes.length) : `${st.nodes.filter(n => n.ready).length}/${st.nodes.length}`, small:true },
    st.nodes.some(n => n.gpus) ? { label:'GPUs', value:`${st.nodes.reduce((a, n) => a + gpuUsed(n), 0)}/${st.nodes.reduce((a, n) => a + (n.gpus || 0), 0)}`, small:true } : null,
    st.mode === 'live' ? { label: st.live.status === 'error' ? 'Live: error' : st.live.status === 'file' ? 'From file' : 'Live', value: st.live.poll ? `${st.live.poll}s` : '', small:true } : null ].filter(Boolean);
  const h = list.map(x => `<div class="stat${x.small ? ' small' : ''}"><div class="k">${x.label}</div><div class="v" data-k="${x.label}">${x.value}</div></div>`).join('');
  if (statsEl._html !== h){ statsEl._html = h; statsEl.innerHTML = h; statsEl.querySelectorAll('.v').forEach(v => { if (prevStats[v.dataset.k] != null && prevStats[v.dataset.k] !== v.textContent) v.classList.add('bump'); prevStats[v.dataset.k] = v.textContent; }); } }
const xrb = $('#xrb'), lblb = $('#lblb'), roomb = $('#roomb'), folb = $('#folb'), ovb = $('#ovb'), yardb = $('#yardb'), vsp = $('#vspin');
function syncSw(){ xrb.setAttribute('aria-pressed', !!st.xrT); lblb.setAttribute('aria-pressed', !html.classList.contains('nolabels')); roomb.setAttribute('aria-pressed', html.classList.contains('room')); folb.setAttribute('aria-pressed', yard.following()); yardb.setAttribute('aria-pressed', isYard()); }
function setRoom(on){ html.classList.toggle('room', on); syncSw(); if (window.ControlRoom) ControlRoom.shown(on); if (isYard()){ scrim.classList.toggle('open', on); if (on){ sheet.classList.remove('open'); chap.classList.remove('open'); hideCard(); } } }
function setYard(on){ html.classList.toggle('yard', on); closeSheets(); hideCard(); closeChips(); scrollTo(0, 0);
  const u = new URL(location.href); if (on) u.searchParams.set('yard', '1'); else u.searchParams.set('yard', '0'); history.replaceState(null, '', u); syncSw(); yard.relayout(); }
function wireSwitches(){
  st.xr = 0; st.xrT = 0; if (Q.get('xr') === '1') st.xr = st.xrT = 1;
  xrb.onclick = () => { st.xrT = st.xrT ? 0 : 1; syncSw(); ui.animate(dt => { const g = Math.sign(st.xrT - st.xr); st.xr = Math.min(1, Math.max(0, st.xr + g*dt/.7)); return st.xr !== st.xrT; }); };
  lblb.onclick = () => { html.classList.toggle('nolabels'); syncSw(); yard.invalidate(); };
  roomb.onclick = () => setRoom(!html.classList.contains('room'));
  folb.onclick = () => { yard.follow(!yard.following()); syncSw(); };
  ovb.onclick = () => yard.overview();
  yardb.onclick = () => setYard(!isYard());
  if (Q.get('labels') === '1') html.classList.remove('nolabels');
  if (Q.get('text') === '0') html.classList.add('notext');
  if (Q.get('room') === '1') setRoom(true);
  // colour swatches recolour the crane, the tower, the roofs, the registry wall and the gate
  const palsEl = document.getElementById('pals');
  for (const [k, p] of Object.entries(PALS)){ const b = document.createElement('button'); b.className = 'sw'; b.title = k; b.style.background = p.l; b.setAttribute('aria-pressed', k === st.pal);
    b.onclick = () => { st.pal = k; [...palsEl.children].forEach(c => c.setAttribute('aria-pressed', c === b)); html.style.setProperty('--accent', p.l); yard.invalidate(); }; palsEl.appendChild(b); }
  html.style.setProperty('--accent', PALS[st.pal].l);
  $('#vreset').onclick = () => yard.front();
  vsp.onclick = () => { const on = yard.spin(); vsp.setAttribute('aria-pressed', on); };
  document.getElementById('compass').onclick = () => yard.front();
  syncSw();
}

/* ---------- mount ---------- */
function init(api){ yard = api; buildButtons(); wireSwitches(); wireClock();
  const ch = Q.get('chapter'); if (ch){ loadChapter(ch); }
  if (Q.has('press')) Q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>'); setTimeout(() => press(label, choice), +ms || 0); });
  const tst = $('#toast'); if (tst) tst.addEventListener('click', e => { e.stopPropagation(); fanToasts(); });
  addEventListener('keydown', e => { if (e.key === 'Escape'){ closeSheets(); hideCard(); } });
}
/* ---------- toasts: a stack of cards receding in space, newest in front; tapping the stack fans them out for a moment ---------- */
const TOAST = { max: 4, step: 8, scale: .96, gap: 6, fanMs: 2600 };
const toasts = [];   // front first, each { el, h, timer, hold }
let fanT = 0;
function layoutToasts(){
  const fan = fanT > 0, up = isYard(), h0 = toasts.length ? toasts[0].h : 0; let y = 0;
  toasts.forEach((c, i) => {
    let tf, op = 1, fl = 'none';
    if (fan){ if (i) y += up ? -(toasts[i - 1].h + TOAST.gap) : c.h + TOAST.gap; tf = `translateY(${y}px)`; }
    else { const s = Math.pow(TOAST.scale, i); tf = `translateY(${-(TOAST.step*i + Math.max(0, h0 - s*c.h))}px) scale(${s})`; op = 1 - .22*i; fl = i ? `blur(${(.35*i).toFixed(2)}px) saturate(${1 - .12*i})` : 'none'; }
    c.el.style.transform = tf; c.el.style.opacity = op; c.el.style.filter = fl; c.el.style.zIndex = 20 - i; });
}
function dropToast(c, dy){ const i = toasts.indexOf(c); if (i < 0) return; toasts.splice(i, 1); clearTimeout(c.timer); const el = c.el;
  el.style.pointerEvents = 'none'; el.style.opacity = 0; el.style.transform = `translateY(${dy}px) scale(${i ? .94 : 1})`; el.style.filter = 'none'; setTimeout(() => el.remove(), 320); }
function expireToast(c){ if (fanT > 0){ c.timer = setTimeout(() => expireToast(c), Math.max(200, fanT - performance.now() + 200)); return; } dropToast(c, 10); layoutToasts(); }
function toast(line, hold = 1600){
  const t = $('#toast'); if (!t) return; const el = document.createElement('div'); el.className = 'tc'; el.innerHTML = `<span>${esc(line)}</span>`;
  el.style.transform = 'translateY(14px) scale(1.04)'; el.style.opacity = 0; t.appendChild(el);
  const c = { el, h: el.offsetHeight, hold };   // one measure, on arrival: the stack is laid out from these heights, never per frame
  toasts.unshift(c); while (toasts.length > TOAST.max) dropToast(toasts[toasts.length - 1], -TOAST.step*TOAST.max);
  c.timer = setTimeout(() => expireToast(c), hold); layoutToasts(); }
function fanToasts(){ const t = $('#toast'); clearTimeout(t._fan); if (fanT > 0){ fanT = 0; t.classList.remove('fan'); layoutToasts(); return; }
  fanT = performance.now() + TOAST.fanMs; t.classList.add('fan'); layoutToasts(); t._fan = setTimeout(() => { fanT = 0; t.classList.remove('fan'); layoutToasts(); }, TOAST.fanMs); }
function tick(){ drawStats(); if (cardAct) renderCard(); }
return { init, tick, open, hideCard, press, openSheet, closeSheets, setRoom, setYard, setClock, stepClock, toast, syncSw, applyChapter, spinOff: () => vsp.setAttribute('aria-pressed', false), EXPLAIN };
})();

<script type="module">
/* ============================================================
   Longshore in three.js: the same yard as figure/longshore.html, drawn with real depth.
   World coordinates are the simulation's (x = depth toward viewer-right, y = width toward viewer-left, z = up);
   three.js sees them as (X = x, Y = z, Z = y), which keeps every screen image the same as the SVG engine's.
   Look: every body has three flat tones picked by how its face meets a light that stays put relative to the
   viewer (BandMaterial), ink comes from one post-pass over depth + normals (heavy at silhouettes, thin at creases,
   wobbled a little), the ground shadow is a flat blue tint from two small shadow maps, text and paint are canvas
   textures on the faces. See src/sim.js for the cluster model this draws.
   ============================================================ */
import * as THREE from './vendor/three.module.js';
THREE.ColorManagement.enabled = false;            // every colour here is an sRGB hex taken as written, like the SVG

const Q = new URLSearchParams(location.search);
if (!st.pal) st.pal = PALS[Q.get('pal')] ? Q.get('pal') : 'mustard';
const V3 = (x, y, z) => new THREE.Vector3(x, z, y);
const COARSE = matchMedia('(pointer:coarse)').matches;
const DPR = () => Math.min(devicePixelRatio || 1, 2);
const CHANNEL = hex => new THREE.Color(hex);

/* ---------- lights, fixed in view space: the sun from over the viewer's right shoulder, a softer one for insides ---------- */
const SUN = new THREE.Vector3(.556, .805, .177).normalize(), LIN = new THREE.Vector3(.239, .414, .878).normalize();
const TONE = { hi:-.15, lo:-.45 }, TONE_I = { hi:.6, lo:.05 };

/* ---------- materials ---------- */
const shared = {   // uniforms every BandMaterial shares (one object each, so one update reaches all)
  shadowVP: { value: new THREE.Matrix4() }, shadowMap: { value: null }, shadowMap2: { value: null }, shadowOn: { value: 1 },
  shadowCol: { value: CHANNEL(SHADOW) }, shadowTexel: { value: 1/1024 } };
const BAND_VS = `varying vec3 vN; varying vec3 vW; varying vec2 vUv;
void main(){ vN = normalize(normalMatrix * normal); vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; vUv = uv; gl_Position = projectionMatrix * viewMatrix * w; }`;
// every surface shader writes two targets at once: the colour, and the normal with the object's ink weight for the edge pass
const GBUF = `\nlayout(location = 0) out highp vec4 pc_fragColor;\n#define gl_FragColor pc_fragColor\nlayout(location = 1) out vec4 gNormal; uniform float inkW;\n`;
const BAND_FS = `#include <packing>
varying vec3 vN; varying vec3 vW; varying vec2 vUv; ${GBUF}
uniform vec3 cl, cm, cd, lightDir, shadowCol; uniform float hi, lo, opacity, receive, hasMap, shadowOn, shadowTexel; uniform sampler2D map, shadowMap, shadowMap2; uniform mat4 shadowVP;
float ss(float a, float b, float x){ float k = clamp((x - a)/(b - a), 0., 1.); return k*k*(3. - 2.*k); }
float lit(sampler2D sm, vec3 s){ if (s.x < 0. || s.x > 1. || s.y < 0. || s.y > 1.) return 0.; float z = unpackRGBAToDepth(texture2D(sm, s.xy)); return s.z - .0018 > z ? 1. : 0.; }
void main(){
  vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
  float d = dot(n, lightDir), a = ss(hi - .18, hi + .18, d), b = ss(lo - .18, lo + .18, d);
  vec3 c = a >= 1. ? cl : b <= 0. ? cd : a > 0. ? mix(cm, cl, a) : b < 1. ? mix(cd, cm, b) : cm;
  if (hasMap > 0.){ vec4 t = texture2D(map, vUv); c = mix(c, t.rgb, t.a); }
  if (receive > 0. && shadowOn > 0.){ vec4 sp = shadowVP * vec4(vW, 1.); vec3 s = sp.xyz / sp.w * .5 + .5;
    float sh = 0.; for (int i = -1; i <= 1; i += 2) for (int j = -1; j <= 1; j += 2) sh += lit(shadowMap, s + vec3(float(i), float(j), 0.) * shadowTexel * .5);
    sh = sh * .25; float sh2 = lit(shadowMap2, s) * .45; c = mix(c, shadowCol, max(sh, sh2)); }
  gl_FragColor = vec4(c, opacity); gNormal = vec4(n*.5 + .5, inkW);
}`;
function band(pal, o = {}){
  const t = o.shade === 'tone' ? TONE : TONE_I;
  const m = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: BAND_VS, fragmentShader: BAND_FS, uniforms: { inkW: { value: 1 },
    cl: { value: CHANNEL(pal.l) }, cm: { value: CHANNEL(pal.m) }, cd: { value: CHANNEL(pal.d) }, lightDir: { value: o.shade === 'tone' ? SUN : LIN },
    hi: { value: t.hi }, lo: { value: t.lo }, opacity: { value: o.opacity == null ? 1 : o.opacity }, receive: { value: o.receive ? 1 : 0 },
    hasMap: { value: o.map ? 1 : 0 }, map: { value: o.map || null }, ...shared } });
  m.transparent = m.uniforms.opacity.value < 1; m.depthWrite = !m.transparent; m.userData.pal = pal; m.userData.palKey = o.palKey || null;
  return m;
}
const setPal = (m, pal) => { m.uniforms.cl.value.set(pal.l); m.uniforms.cm.value.set(pal.m); m.uniforms.cd.value.set(pal.d); m.userData.pal = pal; };
function setAlpha(mesh, a){   // a mesh (or group): every band / flat material gets opacity a, the ink pass is told too
  mesh.traverse(ob => { if (!ob.isMesh) return; ob.userData.ink = a; for (const m of (Array.isArray(ob.material) ? ob.material : [ob.material])){
    if (!m.uniforms || !m.uniforms.opacity) continue; const op = a * (m.userData.baseA == null ? 1 : m.userData.baseA);
    m.uniforms.opacity.value = op; m.transparent = op < 1; m.depthWrite = !m.userData.noDepth && op > .02; } });
