<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Longshore</title></head><body>
<script src="core.js"></script>
<script src="sim.js"></script>
<script>
/* ===== Longshore: a Kubernetes cluster drawn as a container terminal =====

   How the real thing works (each button is one real step; things only move along their real path):
   1. `kubectl apply` a Deployment: the API server (control tower) stores it in etcd; the Deployment controller makes a
      ReplicaSet; the ReplicaSet controller makes Pods, which start Pending (still an image on the registry shelf).
   2. The scheduler (the gantry crane) picks a node with room for each Pending pod and binds it; the kubelet on that
      node pulls the image and starts the containers (amber lamp: ContainerCreating), then the readiness probe passes
      (green lamp: Ready) and the pod becomes a Service endpoint.
   3. Scale: the ReplicaSet wants N; extra pods are created, surplus pods are terminated (they fade out and the slot frees).
   4. Rolling update: a new ReplicaSet (v2, the pale band) surges one pod; each old pod is removed only once a new one
      is Ready (maxSurge 1, maxUnavailable 0), so the Service never has fewer than N endpoints.
   5. A pod is deleted: the ReplicaSet sees N-1 and makes a replacement. A container crashes: the kubelet restarts it in
      place (restarts +1). A readiness probe fails: the pod stays but the Service stops sending to it.
   6. Drain: the node is cordoned (striped tape; the scheduler skips it) and its pods are evicted; the ReplicaSets
      recreate them on the other nodes. Uncordon takes the tape down.
   7. A request: in through the Ingress gate (hostname sign), to the Service kiosk, which forwards it to one Ready
      endpoint (round robin); the reply (green) goes back out the gate. No Ready endpoint: 503.

   Parts (see-through): CONTROL TOWER: etcd cabinet, API server switchboard, scheduler desk, controller manager gearbox.
   NODE: concrete slab, kubelet booth (kubelet desk, container runtime engine, kube-proxy patch panel), capacity gauge,
   cordon tape. POD (a 20-ft container): one crate per container, the pause (sandbox) box, the shared network socket and
   cable to the node's trunk, ConfigMap clipboard, Secret lockbox, PersistentVolume tank on brackets, readiness lamp.
   SCHEDULER: gantry crane on rails (legs, bridge, trolley, cable, spreader, cab). SERVICE: kiosk with an endpoint
   board. INGRESS: gate with hostname beam and boom barrier. REGISTRY: image shelf with a stack per app. DEPLOYMENTS: the
   status board by the tower. */

/* drawing helpers (the simulation itself is in sim.js) */
const cornersOf = (x0,y0,z0,x1,y1,z1) => { const o = []; for (const x of [x0,x1]) for (const y of [y0,y1]) for (const z of [z0,z1]) o.push([x,y,z]); return o; };
const bx3 = (x0,y0,z0,x1,y1,z1) => [[x0,y0,z0],[x1,y1,z1]];
// text on any face: U = the reading direction along the face, V = down the face
const txOn = (p, U, str, size, col = INK, weight = 700, V = [0,0,-1]) => `<text transform="${txM(P(...p), Dv(...U), Dv(...V))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
// a wire as short pieces, each with its own box, so it sorts with the solids it passes
const wirePieces = (pts, col, w = .6) => { const o = []; for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i+1], d = pd([a, b], false);
  o.push({ box: [[0,1,2].map(j => Math.min(a[j], b[j]) - .3), [0,1,2].map(j => Math.max(a[j], b[j]) + .3)],
    svg: `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + .8)}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round"/>` }); } return o; };

/* ================= drawing ================= */
const lampDome = (x, y, z, col, r = 1.1) => cyl(x, y, z, z + .7, r, DARK, toneI, .6, 10) + fill(pd(on(PZ(z + .75), ellUV(x, y, r*.85, r*.85, 10))), col) + fill(pd(on(PZ(z + .8), ellUV(x, y, r*2.2, r*2.2, 12))), col, 'opacity=".22"');
const faceU = n => n[0] > 0 ? [0,-1,0] : n[0] < 0 ? [0,1,0] : n[1] > 0 ? [1,0,0] : [-1,0,0];

/* a pod container at its min corner; the body only (ink included) */
function containerSvg(x0, y0, z0, pm, o){
  const x1 = x0 + PW, y1 = y0 + PL, z1 = z0 + PH;
  let s = box(x0, y0, z0, x1, y1, z1, pm, tone, .9);
  for (const [n, x] of [[[1,0,0], x1 + .06], [[-1,0,0], x0 - .06]]) if (vis(n)){
    let d = ''; for (let y = y0 + 2; y < y1 - 1; y += 2) d += pd([[x, y, z0 + 1], [x, y, z1 - 1]], false);
    s += `<path d="${d}" fill="none" stroke="${INK}" stroke-width=".3" opacity=".35"/>`;
    if (o.band) s += fill(pd([[x, y0 + .4, z1 - 3.2], [x, y1 - .4, z1 - 3.2], [x, y1 - .4, z1 - 1.3], [x, y0 + .4, z1 - 1.3]]), mix(pm.l, '#ffffff', .62));
    s += txOn([x, (y0 + y1)/2, z0 + 3.1], faceU(n), esc(o.app.slice(0, 9).toUpperCase()), 4.2, mix(pm.d, '#000000', .25), 800);
    s += txOn([x, (y0 + y1)/2, z0 + 6.2], faceU(n), esc(o.ver), 2.3, mix(pm.d, '#000000', .25), 700);
    if (o.gpu) s += fill(pd([[x, y0 + .4, z0 + .6], [x, y1 - .4, z0 + .6], [x, y1 - .4, z0 + 2.4], [x, y0 + .4, z0 + 2.4]]), GOLD) + txOn([x, (y0 + y1)/2, z0 + .9], faceU(n), `GPU x${o.gpu}`, 1.6, INK, 800);
  }
  if (o.band && vis([0,0,1])) s += fill(pd([[x0 + .3, y0 + .4, z1 + .05], [x1 - .3, y0 + .4, z1 + .05], [x1 - .3, y1 - .4, z1 + .05], [x0 + .3, y1 - .4, z1 + .05]]), mix(pm.l, '#ffffff', .62), 'opacity=".55"');
  if (vis([0,1,0])){ const y = y1 + .06;   // the doors
    s += ink(pd([[x0 + PW/2, y, z0 + .6], [x0 + PW/2, y, z1 - .6]], false), .7);
    for (const dx of [2.1, 3.5, 6.5, 7.9]) s += ink(pd([[x0 + dx, y, z0 + 1], [x0 + dx, y, z1 - 1]], false), .5);
    for (const dx of [3.5, 6.5]) s += ink(pd([[x0 + dx - .9, y, z0 + 4.6], [x0 + dx + .9, y, z0 + 4.6]], false), .7);
    if (o.name) s += txOn([x0 + PW/2, y, z1 - 1.6], [1,0,0], esc(o.name.slice(-5)), 1.9, mix(pm.d, '#000000', .3), 700); }
  if (vis([0,-1,0])) s += ink(pd([[x0 + 1, y0 - .06, z0 + 1], [x1 - 1, y0 - .06, z0 + 1], [x1 - 1, y0 - .06, z1 - 1], [x0 + 1, y0 - .06, z1 - 1]]), .45);
  for (const z of [z0 + .8, z1 - .8]) if (vis([1,0,0])) s += ink(pd([[x1 + .06, y0 + .4, z], [x1 + .06, y1 - .4, z]], false), .4);
  s += hullInk(cornersOf(x0, y0, z0, x1, y1, z1), 1.8);
  return s;
}
// see-through: the far walls faint, the inside, then the container as a ghost
function ghostBoxSvg(x0,y0,z0,x1,y1,z1, m, k, body, inside){
  const F = [ [[0,1,0], [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]], [[1,0,0], [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]], [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]], [[0,0,-1], [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]] ];
  let far = ''; for (const [n, q] of F) if (!vis(n)) far += face(pd(q), mix(toneI(n.map(v => -v), m), PAPER, .55));
  return `<g opacity="${f(.5*k)}">${far}</g><g opacity="${f(k)}">${inside}</g><g opacity="${f(1 - .8*k)}">${body}</g><g opacity="${f(.6*k)}">${hullInk(cornersOf(x0,y0,z0,x1,y1,z1), 1.8)}</g>`;
}
const PAUSE = { l:'#8d98a8', m:'#6c7686', d:'#434b58' }, LOCK = { l:'#5a5751', m:'#3d3a35', d:'#26241f' };
function podInside(p, x0, y0, z0, k){
  const parts = [], put = (b, svg) => parts.push({ box: b, svg }); const z = z0 + .5, n = p.containers.length, cw = Math.min(7, (PL - 7) / n - 1.2);
  p.containers.forEach((c, i) => { const cy0 = y0 + 2.2 + i*(cw + 1.2), cx0 = x0 + 2, cx1 = cx0 + 6, cz1 = z + 6;
    let s = box(cx0, cy0, z, cx1, cy0 + cw, cz1, CRATE, toneI, .6);
    if (vis([1,0,0])) s += txOn([cx1 + .05, cy0 + cw/2, z + 2.6], [0,-1,0], esc(c.name.slice(0, 9)), 1.5, '#5a4a2a', 700) + ink(pd([[cx1 + .05, cy0 + .6, z + 4.2], [cx1 + .05, cy0 + cw - .6, z + 4.2]], false), .35) + ink(pd([[cx1 + .05, cy0 + .6, z + 1.3], [cx1 + .05, cy0 + cw - .6, z + 1.3]], false), .35);
    if (p.fire > 0 && i === 0) s += `<g opacity="${f(p.fire)}">${fill(pd([[cx0 + 3, cy0 + cw/2 - 2, cz1], [cx0 + 3, cy0 + cw/2 + 2, cz1], [cx0 + 3, cy0 + cw/2, cz1 + 3.5]]), '#ff7a2e')}</g>`;
    put(bx3(cx0, cy0, z, cx1, cy0 + cw, cz1), s); });
  // the pause (sandbox) box holds the pod's network namespace: a socket on the back wall and a cable to the node trunk
  put(bx3(x0 + .8, y0 + PL - 3.4, z, x0 + 3.4, y0 + PL - .8, z + 2.4), box(x0 + .8, y0 + PL - 3.4, z, x0 + 3.4, y0 + PL - .8, z + 2.4, PAUSE, toneI, .5));
  const sock = [x0 + .25, y0 + PL - 2.1, z0 + 5];
  put(bx3(x0, y0 + PL - 3, z0 + 4, x0 + .5, y0 + PL - 1.2, z0 + 6), fill(pd([[x0 + .2, y0 + PL - 3, z0 + 4], [x0 + .2, y0 + PL - 1.2, z0 + 4], [x0 + .2, y0 + PL - 1.2, z0 + 6], [x0 + .2, y0 + PL - 3, z0 + 6]]), GLASS));
  parts.push(...wirePieces([sock, [x0 + .5, y0 + PL - 2.1, z0 + 2.4], [x0 + 2.1, y0 + PL - 2.1, z0 + 2.4]], '#2d7bd6', .45));
  if (p.configMap) put(bx3(x0 + 2.6, y0 + .3, z0 + 3, x0 + 7.4, y0 + .9, z0 + 8.6), box(x0 + 2.6, y0 + .3, z0 + 3, x0 + 7.4, y0 + .9, z0 + 8.6, CERAMIC, toneI, .5)
    + (vis([0,1,0]) ? [4.2, 5.6, 7].map(zz => ink(pd([[x0 + 3.4, y0 + .95, z0 + zz], [x0 + 6.6, y0 + .95, z0 + zz]], false), .35)).join('') + box(x0 + 4.4, y0 + .2, z0 + 8.2, x0 + 5.6, y0 + 1.1, z0 + 9.2, DARK, toneI, .4) : ''));
  if (p.secret) put(bx3(x0 + 6, y0 + 1.2, z, x0 + 9, y0 + 4.4, z + 2.6), box(x0 + 6, y0 + 1.2, z, x0 + 9, y0 + 4.4, z + 2.6, LOCK, toneI, .5) + (vis([1,0,0]) ? fill(pd(on(PX(x0 + 9.05), ellUV(y0 + 2.8, z + 1.3, .6, .6, 8))), '#f2c230') : ''));
  return `<g opacity="${f(k)}">${byDepth(parts)}</g>`;
}
function podItem(p, k){
  const [x0, y0, z0] = p.pos, pm = palOf(p.app), x1 = x0 + PW, y1 = y0 + PL, z1 = z0 + PH;
  let body = containerSvg(x0, y0, z0, pm, { app: p.app, ver: p.ver, band: p.band, name: p.name, gpu: p.gpu });
  body += lampDome(x1 - 2, y1 - 2.6, z1, lampOf(p));
  if (k > 0) body = ghostBoxSvg(x0, y0, z0, x1, y1, z1, pm, k, body, podInside(p, x0, y0, z0, k)) + `<g opacity="${f(k)}">${lampDome(x1 - 2, y1 - 2.6, z1, lampOf(p))}</g>`;
  if (p.fire > 0){ const cx = x0 + PW/2, cy = y0 + PL/2; let fl = '';
    for (const [dy, h] of [[-5, 5], [0, 7.5], [5, 5.5]]) fl += fill(pd([[cx - 2, cy + dy - 2.2, z1], [cx + 2, cy + dy + 2.2, z1], [cx, cy + dy, z1 + h]]), '#ff6a2a') + fill(pd([[cx - 1, cy + dy - 1, z1], [cx + 1, cy + dy + 1, z1], [cx, cy + dy, z1 + h*.6]]), '#ffd23c');
    for (const [dy, h, r] of [[-3, 10, 2], [2, 13, 2.6], [6, 16, 3]]){ const [X, Y] = P(cx, cy + dy, z1 + h); fl += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="#8a8580" opacity=".5"/>`; }
    body += `<g opacity="${f(Math.min(1, p.fire))}">${fl}</g>`; }
  if (p.drop) body += chuteSvg(x0, y0, z0, pm);
  const svg = act('pod', p.alpha < 1 ? `<g opacity="${f(p.alpha)}">${body}</g>` : body, `data-id="${p.id}"`);
  const items = [{ box: bx3(x0, y0, z0, x1, y1, p.drop ? z1 + 18 : z1), svg }];
  if (p.pvc) items.push(tankItem(p, x0, y0, z0, pm));
  return items;
}
// a parachute: a striped canopy with four shroud lines to the container's top corners
function chuteSvg(x0, y0, z0, pm){
  const cx = x0 + PW/2, cy = y0 + PL/2, zt = z0 + PH, rimZ = zt + 8, apex = zt + 17, R = 13, n = 16;
  const rim = on(PZ(rimZ), ellUV(cx, cy, R, R, n)), top = on(PZ(apex), ellUV(cx, cy, 1.2, 1.2, n));
  const corners = { 2: [x0 + PW - .4, y0 + PL - .4, zt], 6: [x0 + .4, y0 + PL - .4, zt], 10: [x0 + .4, y0 + .4, zt], 14: [x0 + PW - .4, y0 + .4, zt] };
  let lines = ''; for (const i of [2, 6, 10, 14]) lines += pd([rim[i], corners[i]], false);
  let s = `<path d="${lines}" fill="none" stroke="${INK}" stroke-width=".7"/>`;
  const cen = [cx, cy, (rimZ + apex)/2];
  for (let i = 0; i < n; i++){ const a0 = rim[i], a1 = rim[(i + 1) % n], b1 = top[(i + 1) % n], b0 = top[i];
    let nr = norm(cross(sub(a1, a0), sub(b0, a0))); if (dot(nr, sub(avg([a0, a1, b1, b0]), cen)) < 0) nr = nr.map(v => -v);
    if (vis(nr)) s += face(pd([a0, a1, b1, b0]), toneI(nr, i % 2 ? pm : CERAMIC)); }
  return s + ink(pd(rim), .9) + hullInk([...rim, ...top], 1.4);
}
// the PersistentVolume: a tank on two brackets off the container's far end
function tankItem(p, x0, y0, z0, pm){
  const cx = x0 + 5, cy = y0 - 3.2, r = 2.6, TANK = { l:'#dfe6ea', m:'#b9c5cb', d:'#7f8d94' };
  let s = box(x0 + 3.2, y0 - 2.2, z0 + 1.6, x0 + 6.8, y0, z0 + 2.4, DARK, toneI, .5) + box(x0 + 3.2, y0 - 2.2, z0 + 7.4, x0 + 6.8, y0, z0 + 8.2, DARK, toneI, .5);
  s += cyl(cx, cy, z0 + .4, z0 + 9.4, r, TANK, toneI, 1.1, 18);
  if (vis([1,0,0])) s += txOn([cx + r + .05, cy, z0 + 4], [0,-1,0], 'PV', 2.2, '#4d5a60', 800);
  s += rod([cx, cy, z0 + 9.4], [cx, cy, z0 + 10.4], .6, DARK, toneI, .5);
  return { box: bx3(x0 + 2.4, y0 - 5.9, z0, x0 + 7.6, y0, z0 + 10.5), svg: p.alpha < 1 ? `<g opacity="${f(p.alpha)}">${s}</g>` : s };
}
/* a node: slab (with the tier-0 shadows), booth, gauge, cordon tape */
function nodeItems(n, k, m){
  const x0 = n.x0, y0 = n.y0, x1 = x0 + SLD, y1 = y0 + SLW, items = [], top = on(PZ(SLH), rectUV(x0, y0, x1, y1));
  if (n.joined < 1){ const j = ease(n.joined), bx0 = x0 - 18, bx1 = x0 - 8, by0 = y1 - 16, by1 = y1 - 4;
    if (j <= 0) return items;
    items.push({ box: bx3(x0, y0, 0, x1, y1, SLH), svg: `<g opacity="${f(Math.min(1, j*2))}">${box(x0, y0, 0, x1, y1, Math.max(.3, SLH*j), CONC, tone, 1.2)}</g>`, floor: true });
    items.push({ box: bx3(bx0, by0, 0, bx1, by1, 14), svg: `<g opacity="${f(Math.min(1, j*2))}">${box(bx0, by0, 0, bx1, by1, Math.max(.3, 12*j), CONC, tone, 1)}${box(bx0 - .8, by0 - .8, 12*j, bx1 + .8, by1 + .8, 12*j + 1.5, m, tone, .9)}</g>` });
    return items; }
  let s = box(x0, y0, 0, x1, y1, SLH, CONC, tone, 1.2);
  const mine = st.pods.filter(p => p.node === n.name && p.pos && p.slot);
  let sh = ''; for (const p of mine) if (p.slot.t === 0 && p.phase !== 'scheduled') sh += castShadow(cornersOf(p.pos[0], p.pos[1], SLH, p.pos[0] + PW, p.pos[1] + PL, SLH + PH), SLH, top);
  s += `<g opacity=".9">${sh}</g>`;
  if (vis([0,0,1])){ for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!n.used.has(slotKey({ c, r, t:0 }))){ const [sx, sy] = slotPos(n, { c, r, t:0 });
      s += `<path d="${pd(on(PZ(SLH + .05), rectUV(sx, sy, sx + PW, sy + PL)))}" fill="none" stroke="${INK}" stroke-width=".5" stroke-dasharray="2 1.5" opacity=".45"/>`; }
    s += txOn([x1 - 3.2, y0 + SLW/2, SLH + .06], [0,-1,0], esc(n.name) + (n.gpus ? `  GPU x${n.gpus}` : ''), 4.2, '#6b6559', 800, [1,0,0]);
    if (k > 0){ let tr = ''; for (const p of mine){ tr += pd([[p.pos[0] + .5, p.pos[1] + PL - 2.1, SLH + .1], [x0 + 2, p.pos[1] + PL - 2.1, SLH + .1], [x0 + 2, y1 - 10, SLH + .1], [x0 - 2, y1 - 10, SLH + .1]], false); }
      s += `<g opacity="${f(k)}"><path d="${tr}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/><path d="${tr}" fill="none" stroke="#2d7bd6" stroke-width=".9" stroke-linejoin="round"/></g>`; } }
  items.push({ box: bx3(x0, y0, 0, x1, y1, SLH), svg: s, floor: true });
  for (let i = 0; i < (n.gpus || 0); i++){ const gy0 = y0 + 8 + i*11, gx0 = x0 + 1, used = i < gpuUsed(n);
    let g = box(gx0, gy0, SLH, gx0 + 4, gy0 + 8, SLH + 5, LOCK, toneI, .6);
    if (vis([1,0,0])) g += fill(pd([[gx0 + 4.06, gy0 + .4, SLH + 3.6], [gx0 + 4.06, gy0 + 7.6, SLH + 3.6], [gx0 + 4.06, gy0 + 7.6, SLH + 4.6], [gx0 + 4.06, gy0 + .4, SLH + 4.6]]), GOLD) + txOn([gx0 + 4.06, gy0 + 4, SLH + 1.2], [0,-1,0], 'GPU', 1.7, GOLD, 800);
    if (vis([0,0,1])){ let d = ''; for (let fy = gy0 + 1; fy < gy0 + 8; fy += 1) d += pd([[gx0 + .5, fy, SLH + 5.05], [gx0 + 3.5, fy, SLH + 5.05]], false); g += `<path d="${d}" fill="none" stroke="${INK}" stroke-width=".3" opacity=".6"/>`; }
    g += lampDome(gx0 + 2, gy0 + 6.6, SLH + 5, used ? LAMPC.amber : LAMPC.green, .6);
    items.push({ box: bx3(gx0, gy0, SLH, gx0 + 4, gy0 + 8, SLH + 6), svg: g }); }
  // kubelet booth behind the slab's far corner
  const bx0 = x0 - 18, bx1 = x0 - 8, by0 = y1 - 16, by1 = y1 - 4, bz = 12;
  let b = box(bx0, by0, 0, bx1, by1, bz, CONC, tone, 1);
  if (vis([1,0,0])) b += fill(pd([[bx1 + .06, by0 + 3, 5], [bx1 + .06, by1 - 3, 5], [bx1 + .06, by1 - 3, 9.4], [bx1 + .06, by0 + 3, 9.4]]), GLASS) + ink(pd([[bx1 + .06, by0 + 3, 5], [bx1 + .06, by1 - 3, 5], [bx1 + .06, by1 - 3, 9.4], [bx1 + .06, by0 + 3, 9.4]]), .7)
    + `<path d="${pd([[bx1 + .1, by0 + 3.6, 8.8], [bx1 + .1, by0 + 5.6, 8.8]], false)}" stroke="#ffffff" stroke-width=".8" opacity=".4" fill="none"/>` + txOn([bx1 + .06, (by0 + by1)/2, 11.2], [0,-1,0], 'KUBELET', 1.8, '#6b6559', 800);

function parcelItems(){

/* xrCallouts from the kit, but the right column starts under the stats panel and the switches */
function yardCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const Lc = [], Rc = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, ctm = svgEl.getScreenCTM();
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? Lc : Rc).push({ ...it, X, Y }); }
  let s = '';
  const top = { [-1]: fs, [1]: fs };
  const under = (sel, side) => { const el = document.querySelector(sel); if (!el || !ctm || !el.offsetParent || u) return; const r = el.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 10).matrixTransform(ctm.inverse()); if (q.y > vb.y + vb.height*.5) return; if (q.y > top[side]) top[side] = q.y + hgt/2; };
  under('#btns', -1); under('#stats', 1); under('.vset', 1);
  for (const [col, side] of [[Lc, -1], [Rc, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}

/* ---------- framing (re-done when the cluster changes size) ---------- */
function reframe(){
  const svg = document.getElementById('fig'); if (!svg) return;
  const y = YAW, p = PITCH, pts = []; OX = OY = 0; RC = [W/2, D/2]; RCZ = HTOP/2; setCam(YAW0, PITCH0);
  for (const x of [0, W]) for (const yy of [0, D]) for (const z of [0, HTOP]) pts.push(P(x, yy, z));
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]), bw = Math.max(...xs) - Math.min(...xs), bh = Math.max(...ys) - Math.min(...ys);
  const PA = window.FIG_A ? FIG_A() : .75, A = PA === .75 ? .75 : Math.min(PA, Math.max(.75, bh/.88/(bw/.74)*1.08)), vbW = Math.max(bw/.64, bh/.88/A), vbH = vbW*A;

}

  acts:{ pod:(st, el) => { const p = st.pods.find(p => p.id === +el.dataset.id); if (p) podInfo(p); },

  params:(st, q) => {

  } });
